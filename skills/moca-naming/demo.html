<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MoCA 命名题 - Skill 协议演示</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'PingFang SC', system-ui, sans-serif;
    background: #FDFBF7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .demo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1100px;
    width: 100%;
  }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }
  .panel h3 {
    font-size: 14px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid #eee;
  }
  .app-ui { min-height: 400px; }
  .animal-display {
    text-align: center;
    margin: 20px 0;
  }
  .animal-display .emoji {
    font-size: 100px;
    display: block;
    margin-bottom: 8px;
  }
  .animal-display .label {
    font-size: 24px;
    font-weight: 800;
    color: #333;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
  }
  .option {
    padding: 14px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    background: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .option:hover { border-color: #5a9b6e; background: #f0faf4; }
  .option.correct { border-color: #22a96b; background: #d0f5e4; }
  .option.wrong { border-color: #e55; background: #ffe8e8; }
  .bubble {
    background: rgba(250,248,243,0.9);
    border-radius: 16px;
    padding: 14px 18px;
    margin: 12px 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
  }
  .bubble.hint { border-left: 3px solid #f5c842; background: #fffef5; }
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 12px 0;
  }
  .score-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid #ddd;
    background: #fff;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .score-dot.got { background: #22a96b; color: #fff; border-color: #22a96b; }
  .score-dot.miss { background: #e55; color: #fff; border-color: #e55; }
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin: 4px;
  }
  .btn-primary { background: #f5c842; color: #4a3808; }
  .btn-hint { background: #f0f0f0; color: #666; }
  .btn-next { background: #22a96b; color: #fff; }
  .btn:disabled { opacity: 0.4; pointer-events: none; }

  .log { font-family: 'SF Mono', monospace; font-size: 12px; max-height: 400px; overflow-y: auto; }
  .log-entry { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .log-entry .dir { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-right: 8px; }
  .dir.app { background: #e3f2fd; color: #1565c0; }
  .dir.ai  { background: #e8f5e9; color: #2e7d32; }
  .json { color: #666; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>

<div class="demo">
  <!-- LEFT: App UI simulation -->
  <div>
    <div class="panel app-ui">
      <h3>App 界面（模拟）</h3>
      <div id="ui">
        <div style="text-align:center;padding:40px 0;">
          <p style="font-size:18px;color:#999;">准备开始动物命名评估</p>
          <button class="btn btn-primary" onclick="startTask()" id="startBtn">开始</button>
        </div>
      </div>
      <div id="scoreDisplay" style="margin-top: 12px;"></div>
    </div>
  </div>

  <!-- RIGHT: Protocol log -->
  <div class="panel">
    <h3>Skill 协议日志（App ↔ AI）</h3>
    <div class="log" id="log">
      <div class="log-entry" style="color:#999;">等待开始...</div>
    </div>
  </div>
</div>

<script>
// ── Skill protocol engine (simulated AI) ──

const ANIMALS = [
  { key: "lion", emoji: "🦁", answer: "狮子", options: ["狮子","老虎","豹子","狐狸"], hint: "它被称为百兽之王" },
  { key: "rhino", emoji: "🦏", answer: "犀牛", options: ["河马","犀牛","水牛","野猪"], hint: "它的鼻子上有一只角" },
  { key: "camel", emoji: "🐪", answer: "骆驼", options: ["长颈鹿","马","骆驼","羊驼"], hint: "它背上有驼峰" }
];

let state = { phase: "idle", itemIndex: 0, scores: [], usedHint: false };

function log(dir, json) {
  const el = document.getElementById("log");
  const d = dir === "App→AI" ? "app" : "ai";
  el.innerHTML += `<div class="log-entry"><span class="dir ${d}">${dir}</span><span class="json">${JSON.stringify(json, null, 1)}</span></div>`;
  el.scrollTop = el.scrollHeight;
}

function startTask() {
  state = { phase: "assess", itemIndex: 0, scores: [], usedHint: false };

  // App → AI: task_started
  const appMsg = { event: "task_started", taskId: "naming" };
  log("App→AI", appMsg);

  // AI → App: guide_intro
  const aiMsg = { action: "guide_intro", bubble_text: "接下来我会给您看几张动物的图片，请您告诉我这是什么动物。" };
  log("AI→App", aiMsg);
  document.getElementById("scoreDisplay").innerHTML = '<div class="score-bar">' +
    ANIMALS.map((_,i) => `<div class="score-dot" id="dot${i}">${i+1}</div>`).join("") + '</div>';

  showQuestion(0);
}

function showQuestion(index) {
  if (index >= ANIMALS.length) { finishTask(); return; }
  state.itemIndex = index;
  state.usedHint = false;

  const a = ANIMALS[index];

  // AI → App: show_question
  const aiMsg = { action: "show_question", item_index: index, item_key: a.key, options: a.options };
  log("AI→App", aiMsg);

  let html = `<div class="animal-display"><span class="emoji">${a.emoji}</span></div>`;
  html += `<div class="bubble">这是什么动物？</div>`;
  html += `<div class="options">`;
  a.options.forEach(opt => {
    html += `<button class="option" onclick="userAnswer('${opt}')">${opt}</button>`;
  });
  html += `</div>`;
  html += `<button class="btn btn-hint" onclick="userHint()" id="hintBtn">帮助</button>`;
  document.getElementById("ui").innerHTML = html;
}

function userAnswer(answer) {
  const a = ANIMALS[state.itemIndex];
  const correct = answer === a.answer;
  const useHint = state.usedHint;
  const score = (correct && !useHint) ? 1 : 0;

  // App → AI: user_answer
  const appMsg = { event: "user_answer", item_key: a.key, answer, used_hint: useHint, result: correct ? "correct" : "wrong" };
  log("App→AI", appMsg);

  // AI → App: show_feedback
  const dotId = "dot" + state.itemIndex;
  const aiMsg = { action: "show_feedback", score, result: useHint ? "hinted" : (correct ? "correct" : "wrong"), correct_answer: a.answer };
  log("AI→App", aiMsg);

  // Highlight options
  document.querySelectorAll(".option").forEach(el => {
    if (el.textContent === a.answer) el.classList.add("correct");
    if (el.textContent === answer && !correct) el.classList.add("wrong");
    el.style.pointerEvents = "none";
  });
  document.getElementById("hintBtn").disabled = true;

  // Show bubble
  const bubbleText = useHint ? `没错，不过用了提示哦。这是${a.answer}。` :
    correct ? `对的，这是${a.answer}！` : `这个其实是${a.answer}。`;
  document.getElementById("ui").innerHTML += `<div class="bubble">${bubbleText}</div>`;
  document.getElementById("ui").innerHTML += `<button class="btn btn-next" onclick="nextQuestion()">继续</button>`;

  // Update score dot
  if (score) document.getElementById(dotId).classList.add("got");
  else document.getElementById(dotId).classList.add("miss");

  state.scores.push({ key: a.key, answer, correct: correct && !useHint, score, usedHint: useHint });
}

function userHint() {
  state.usedHint = true;
  const a = ANIMALS[state.itemIndex];

  // App → AI: used hint
  const appMsg = { event: "user_answer", item_key: a.key, used_hint: true };
  log("App→AI", appMsg);

  // AI → App: show_hint
  const aiMsg = { action: "show_hint", bubble_text: a.hint };
  log("AI→App", aiMsg);

  // Narrow options: remove 2 wrong ones
  const wrongOptions = a.options.filter(o => o !== a.answer);
  const toRemove = wrongOptions.slice(0, 2);
  document.querySelectorAll(".option").forEach(el => {
    if (toRemove.includes(el.textContent)) el.style.display = "none";
  });
  document.getElementById("hintBtn").disabled = true;
  document.getElementById("ui").innerHTML += `<div class="bubble hint">💡 ${a.hint}</div>`;
}

function nextQuestion() {
  // AI → App: next_question
  const aiMsg = { action: "next_question", next_index: state.itemIndex + 1, is_last: state.itemIndex >= ANIMALS.length - 1 };
  log("AI→App", aiMsg);

  showQuestion(state.itemIndex + 1);
}

function finishTask() {
  const total = state.scores.filter(s => s.score > 0).length;
  const texts = { 3: "三题都答对了，非常好！", 2: "答对了两题，不错！", 1: "答对了一题，我们继续加油。", 0: "没关系，我们继续下一项。" };
  const bubble = texts[total] || "";

  // AI → App: task_complete
  const aiMsg = { action: "task_complete", total_score: total, max_score: 3, items: state.scores, bubble_text: bubble };
  log("AI→App", aiMsg);

  document.getElementById("ui").innerHTML += `<div class="bubble" style="font-size:20px;text-align:center;">${bubble}<br><small>得分：${total}/3</small></div>`;
  document.getElementById("ui").innerHTML += `<div style="text-align:center;margin-top:16px;"><button class="btn btn-primary" onclick="location.reload()">重新开始</button></div>`;
}
</script>
</body>
</html>
