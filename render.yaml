services:
  - type: web
    name: moca-game-app
    env: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: moca-game-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
