services:
  - type: web
    name: cognition-hearing-game
    env: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: cognition-hearing-game-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
